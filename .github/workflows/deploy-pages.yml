# Test the website and publish it on GitHub Pages (Settings -> Pages -> Source: GitHub Actions).
# This publishes what is in site/. It does not build firmware. Packages reach the site only by
# hand: the demo's through tools/promote-emulator-build.mjs, the installer's through
# tools/promote-release.mjs, which names one in site/release.json (docs/WEBSITE.md). The one
# exception is official Open, which is not committed: it comes from M-VAVE's release here, and
# anything that differs from the hashes in site/release.json stops the build (and so the deploy).

name: Website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - releases/**
      - tools/build-site.mjs
      - tools/fetch-open-firmware.mjs
      - tools/fm1-web.mjs
      - tools/fm1-update-sim.mjs
      - tools/test-site.mjs
      - tools/serve-site.mjs
      - docs/POCKET-CONTROLS.md
      - docs/POCKET-STORAGE.md
      - .github/workflows/deploy-pages.yml
  pull_request:
    paths:
      - site/**
      - releases/**
      - tools/build-site.mjs
      - tools/fetch-open-firmware.mjs
      - tools/fm1-web.mjs
      - tools/fm1-update-sim.mjs
      - tools/test-site.mjs
      - tools/serve-site.mjs
      - docs/POCKET-CONTROLS.md
      - docs/POCKET-STORAGE.md
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true      # third_party/fm1_open: its update code and licences go with the site
          fetch-depth: 0        # a test compares the release with the firmware sources' history

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/cache@v4
        with:
          path: build/upstream      # checked against site/release.json before it is used
          key: fm1-open-${{ hashFiles('site/release.json') }}
          restore-keys: fm1-open-

      - name: Get official Open firmware
        run: node tools/fetch-open-firmware.mjs

      - name: Test the site
        run: node --test tools/test-site.mjs

      - name: Build the site
        run: node tools/build-site.mjs

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
